<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#c0242c">
<meta name="robots" content="noindex">
<title>Painel VTR 3º BPM</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  html, body { margin: 0; height: 100%; background: #ffffff; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #17223a; }
  iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; }
  #abertura { position: fixed; inset: 0; z-index: 2; background: #ffffff; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 16px; text-align: center; transition: opacity .3s; }
  #abertura img { width: 100px; height: auto; }
  #abertura h1 { margin: 0; font-size: 22px; text-transform: uppercase; letter-spacing: .02em; }
  #abertura p { margin: 0; color: #5b6780; font-size: 14px; }
  #abertura.sumir { opacity: 0; pointer-events: none; }
  #direto { padding: 12px 18px; border-radius: 8px; background: #2445b3; color: #fff; text-decoration: none; font-weight: 600; }
</style>
</head>
<body>
<div id="abertura">
  <img src="brasao.png" alt="Brasão do 3º BPM">
  <h1>Painel do Administrador</h1>
  <p id="status">Carregando…</p>
  <a id="direto" href="" hidden>Abrir o painel direto</a>
</div>
<iframe id="app" title="Painel do Administrador 3º BPM" allow="clipboard-write; fullscreen"></iframe>
<script>
  // Mesmo link do app, com ?pagina=admin no final.
  const APP = "https://script.google.com/macros/s/AKfycbwlOANnS3bKIP-qgpvJPh5j-RJ4JSZG4-I3nr6LfTIXoE2WjUO0HYB29PZGXdSq1Q05tg/exec?pagina=admin";
  const frame = document.getElementById("app"), abertura = document.getElementById("abertura"), direto = document.getElementById("direto");
  direto.href = APP;
  frame.addEventListener("load", () => abertura.classList.add("sumir"));
  frame.src = APP;
  setTimeout(() => { if (!abertura.classList.contains("sumir")) { document.getElementById("status").textContent = "Está demorando. Verifique a internet ou abra direto:"; direto.hidden = false; } }, 15000);
</script>
</body>
</html>
